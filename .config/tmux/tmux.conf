# ==============================
# TMUX CONFIG — afrijaldz/dotfiles
# ==============================

# Terminal
set -g default-terminal "screen-256color"

# Prefix: Ctrl+A
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Split pane (intuitive)
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Resize pane (repeatable)
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Maximize / zoom pane toggle
bind -r m resize-pane -Z

# Mouse support
set -g mouse on

# Vi-style copy mode
set-window-option -g mode-keys vi

# Copy mode: select & yank
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "~/.local/bin/tmux-yank"

# Paste from the system clipboard. The helper picks the right tool per platform
# (pbpaste, WSL, Wayland, X11) and strips the trailing newline so pasting a
# copied line doesn't add an extra enter.
bind-key P run "~/.local/bin/tmux-paste | tmux load-buffer -" \; paste-buffer

# Disable mouse drag in copy mode
unbind -T copy-mode-vi MouseDragEnd1Pane

# ==============================
# Pane navigation: Ctrl+hjkl (no prefix!)
# Smart vim-tmux-navigator pattern
# ==============================
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Ctrl+\ to toggle last pane
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\\\\\'  'select-pane -l'"

# ==============================
# TPM — Tmux Plugin Manager
# ==============================
set -g @tpm_plugins ' \
  jimeh/tmux-themepack \
  tmux-plugins/tmux-resurrect \
  tmux-plugins/tmux-continuum \
'

set -g @themepack 'powerline/default/cyan'

# Start light. Themepack has no light theme, so this pre-sets its palette and
# the theme derives from it — see the file for why that works. Must stay above
# the `run '.../tpm'` line at the bottom, which is what sources the theme.
# Dark mode is simply this line not running.
source-file ~/.config/tmux/themes/light.conf
set -g @theme-mode 'light'

# Toggle dark/light without restarting the server. Re-sourcing alone can't do
# it (themepack's `set -goq` won't overwrite what's already set), so the script
# clears the old options first.
bind T run-shell '~/.config/tmux/scripts/theme-toggle.sh'

# ==============================
# Session persistence
# ==============================
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Continuum's autosave runs off the status bar refresh (`#()` in status-right),
# so it only ticks while a client is attached. Shorter interval = smaller window
# of loss if the machine dies suddenly.
set -g @continuum-save-interval '5'

# Start the tmux server automatically at login. Without this, after a reboot
# there's no server at all until we type `tmux`, so nothing gets restored.
#
# The mechanism differs per OS, so this can't be one flat option:
#   Linux — continuum's own systemd support (creates + enables
#     ~/.config/systemd/user/tmux.service; bootstrap.sh symlinks our unit over
#     it so shutdown goes through the save guard first).
#   macOS — there is no systemd. Continuum's macOS "boot" instead adds a login
#     item that opens Terminal.app and starts tmux inside it, which pops a
#     window on every login. So it stays OFF here, and bootstrap.sh installs a
#     launchd agent that starts the server headlessly instead.
if-shell '[ "$(uname -s)" = Darwin ]' \
    "set -g @continuum-boot 'off'" \
    "set -g @continuum-boot 'on'"

# `start-server` (not `new-session -d`) — just spin up the server so continuum
# restore can run, without adding an empty session next to the restored one.
# The launchd agent on macOS is generated with the same argument.
set -g @continuum-systemd-start-cmd 'start-server'

# Must be paired with `start-server` above: the default `exit-empty on` makes
# the server die immediately after it's born because it has no session yet, so
# restore (which waits 1 second) never gets a chance to run.
set -g exit-empty off

# Save on every detach too — once detached, autosave stops ticking until you
# attach again, so without this hook the last state can go stale for hours.
set-hook -g client-detached 'run-shell "~/.config/tmux/scripts/resurrect-save-guard.sh"'

# By default resurrect only restores layout + cwd; running programs are lost.
# `~` = restore the process along with its arguments.
set -g @resurrect-processes '"~claude" "~ssh" "~nvim" "~lazygit" "~btop" "~htop"'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
