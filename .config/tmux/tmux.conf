# ==============================
# TMUX CONFIG — afrijaldz/dotfiles
# ==============================

# Terminal
set -g default-terminal "screen-256color"

# Prefix: Ctrl+A
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Split pane (intuitive)
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Resize pane (repeatable)
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Maximize / zoom pane toggle
bind -r m resize-pane -Z

# Mouse support
set -g mouse on

# Vi-style copy mode
set-window-option -g mode-keys vi

# Copy mode: select & yank
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "~/.local/bin/tmux-yank"

# Paste from Windows clipboard (WSL) — strip trailing newline biar ga tambah enter
bind-key P run "powershell.exe -NoProfile -Command Get-Clipboard | perl -pe 'chomp if eof' | tmux load-buffer -" \; paste-buffer

# Disable mouse drag in copy mode
unbind -T copy-mode-vi MouseDragEnd1Pane

# ==============================
# Pane navigation: Ctrl+hjkl (no prefix!)
# Smart vim-tmux-navigator pattern
# ==============================
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Ctrl+\ to toggle last pane
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\\\\\'  'select-pane -l'"

# ==============================
# TPM — Tmux Plugin Manager
# ==============================
set -g @tpm_plugins ' \
  jimeh/tmux-themepack \
  tmux-plugins/tmux-resurrect \
  tmux-plugins/tmux-continuum \
'

set -g @themepack 'powerline/default/cyan'

# ==============================
# Session persistence
# ==============================
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Autosave-nya continuum jalan lewat refresh status bar (`#()` di status-right),
# jadi cuma nge-tick selama ada client yang attach. Interval pendek = window
# kehilangan lebih kecil kalau mesin mati mendadak.
set -g @continuum-save-interval '5'

# Start tmux server otomatis saat login (bikin + enable ~/.config/systemd/user/tmux.service).
# Tanpa ini, setelah reboot ga ada server sama sekali sampai kita ketik `tmux`.
# Bonus: ExecStop unit-nya nge-save dulu sebelum kill, jadi shutdown ga makan state.
set -g @continuum-boot 'on'
# `start-server` (bukan `new-session -d`) — cukup nyalain server biar continuum
# restore jalan, tanpa nambah session kosong di samping session hasil restore.
set -g @continuum-systemd-start-cmd 'start-server'

# Wajib berpasangan dengan `start-server` di atas: default `exit-empty on` bikin
# server langsung mati begitu lahir karena belum punya session, jadi restore
# (yang nunggu 1 detik) ga pernah kebagian jalan.
set -g exit-empty off

# Save juga tiap detach — begitu detach, autosave berhenti nge-tick sampai
# attach lagi, jadi tanpa hook ini state terakhir bisa basi berjam-jam.
set-hook -g client-detached 'run-shell "~/.config/tmux/scripts/resurrect-save-guard.sh"'

# Resurrect defaultnya cuma balikin layout + cwd, program yang lagi jalan mati.
# `~` = restore beserta argumennya.
set -g @resurrect-processes '"~claude" "~ssh" "~nvim" "~lazygit" "~btop" "~htop"'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
