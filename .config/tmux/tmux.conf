# ==============================
# TMUX CONFIG — afrijaldz/dotfiles
# ==============================

# Terminal
set -g default-terminal "tmux-256color"

# Pass modified keys (Shift+Enter, Ctrl+Enter, ...) through to the app.
# Without this tmux collapses them to a plain Enter, so TUIs like Claude Code
# submit instead of inserting a newline.
set -s extended-keys on
set -as terminal-features "xterm-ghostty:extkeys"
set -as terminal-features "xterm-kitty:extkeys"

# Prefix: Ctrl+A, with a hint menu.
#
# Ctrl+A opens a menu of the next keys (see prefix-menu.conf) instead of
# silently waiting for one. The prefix option itself is unset because tmux
# checks the real prefix before any root-table binding, so a `bind -n C-a`
# would never fire next to it. The `prefix` key table still exists with every
# default binding; the second menu page's Space entry drops into it, and so
# does the fallback below when the terminal is too short to fit the menu (26
# rows plus a little margin — keep in step with prefix-menu*.conf).
set -g prefix None
unbind C-b
bind -n C-a if-shell -F '#{e|<:#{client_height},30}' \
    'switch-client -T prefix' \
    'source-file ~/.config/tmux/prefix-menu.conf'
bind -T copy-mode-vi C-a switch-client -T prefix

# Split pane (intuitive)
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# Reload config. The notice is a centered menu rather than a status-line
# message so it cannot be missed; any key closes it.
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-menu -T ' tmux ' -x C -y C 'Config reloaded' '' ''

# Confirmations and text prompts as centered dialogs. These mirror the menu
# entries so the bare prefix table (the short-terminal fallback) behaves the
# same instead of falling back to the stock status-line prompts.
bind x source-file ~/.config/tmux/confirm-kill-pane.conf
bind & source-file ~/.config/tmux/confirm-kill-window.conf
bind , display-popup -E -T ' Rename window ' -w 60 -h 3 '~/.config/tmux/scripts/prompt-popup.sh window'
bind '$' display-popup -E -T ' Rename session ' -w 60 -h 3 '~/.config/tmux/scripts/prompt-popup.sh session'
bind : display-popup -E -T ' tmux command ' -w 80 -h 3 '~/.config/tmux/scripts/prompt-popup.sh command'

# Resize pane (repeatable)
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Maximize / zoom pane toggle
bind -r m resize-pane -Z

# Mouse support
set -g mouse on

# Copying hands the text to the outer terminal with OSC 52, which then owns the
# system clipboard. One owner, and it is a process that stays alive as long as
# the terminal window does. This also works over SSH.
set -g set-clipboard on

# Vi-style copy mode
set-window-option -g mode-keys vi

# Copy mode: select & yank.
#
# The copy goes to the system clipboard through OSC 52 (`set-clipboard on`
# above), so the outer terminal owns the X11 selection. Piping to xclip here
# instead would make a second, short-lived process fight the terminal for that
# ownership, and an app pasting from the loser of that race hangs waiting for a
# reply that never comes.
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel

# Paste from the system clipboard. The helper picks the right tool per platform
# (pbpaste, WSL, Wayland, X11) and strips the trailing newline so pasting a
# copied line doesn't add an extra enter.
bind-key P run "~/.local/bin/tmux-paste | tmux load-buffer -" \; paste-buffer

# Mouse selection copies to the system clipboard. With `mouse on` the terminal
# never sees the drag, so Ghostty's copy-on-select can't fire — tmux has to do
# the copying itself. Same for double-click (word) and triple-click (line),
# whose defaults only fill a tmux buffer.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -n DoubleClick1Pane select-pane \; copy-mode -H \; send-keys -X select-word \; run-shell -d0.3 "tmux send-keys -X copy-selection-and-cancel"
bind-key -n TripleClick1Pane select-pane \; copy-mode -H \; send-keys -X select-line \; run-shell -d0.3 "tmux send-keys -X copy-selection-and-cancel"

# ==============================
# Pane navigation: Ctrl+hjkl (no prefix!)
# Smart vim-tmux-navigator pattern
# ==============================
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Ctrl+\ to toggle last pane
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\\\\\'  'select-pane -l'"

# ==============================
# TPM — Tmux Plugin Manager
# ==============================
set -g @tpm_plugins ' \
  jimeh/tmux-themepack \
  tmux-plugins/tmux-resurrect \
  tmux-plugins/tmux-continuum \
'

set -g @themepack 'powerline/default/cyan'

# Start light. Themepack has no light theme, so this pre-sets its palette and
# the theme derives from it — see the file for why that works. Must stay above
# the `run '.../tpm'` line at the bottom, which is what sources the theme.
# Dark mode is simply this line not running.
source-file ~/.config/tmux/themes/light.conf
set -g @theme-mode 'light'

# Toggle dark/light without restarting the server. Re-sourcing alone can't do
# it (themepack's `set -goq` won't overwrite what's already set), so the script
# clears the old options first.
bind T run-shell '~/.config/tmux/scripts/theme-toggle.sh'

# ==============================
# Session persistence
# ==============================
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Continuum's autosave runs off the status bar refresh (`#()` in status-right),
# so it only ticks while a client is attached. Shorter interval = smaller window
# of loss if the machine dies suddenly.
set -g @continuum-save-interval '5'

# Start the tmux server automatically at login. Without this, after a reboot
# there's no server at all until we type `tmux`, so nothing gets restored.
#
# The mechanism differs per OS, so this can't be one flat option:
#   Linux — continuum's own systemd support (creates + enables
#     ~/.config/systemd/user/tmux.service; bootstrap.sh symlinks our unit over
#     it so shutdown goes through the save guard first).
#   macOS — there is no systemd. Continuum's macOS "boot" instead adds a login
#     item that opens Terminal.app and starts tmux inside it, which pops a
#     window on every login. So it stays OFF here, and bootstrap.sh installs a
#     launchd agent that starts the server headlessly instead.
if-shell '[ "$(uname -s)" = Darwin ]' \
    "set -g @continuum-boot 'off'" \
    "set -g @continuum-boot 'on'"

# `start-server` (not `new-session -d`) — just spin up the server so continuum
# restore can run, without adding an empty session next to the restored one.
# The launchd agent on macOS is generated with the same argument.
set -g @continuum-systemd-start-cmd 'start-server'

# Must be paired with `start-server` above: the default `exit-empty on` makes
# the server die immediately after it's born because it has no session yet, so
# restore (which waits 1 second) never gets a chance to run.
set -g exit-empty off

# Save on every detach too — once detached, autosave stops ticking until you
# attach again, so without this hook the last state can go stale for hours.
set-hook -g client-detached 'run-shell "~/.config/tmux/scripts/resurrect-save-guard.sh"'

# By default resurrect only restores layout + cwd; running programs are lost.
# `~` = restore the process along with its arguments.
set -g @resurrect-processes '"~claude" "~ssh" "~nvim" "~lazygit" "~btop" "~htop"'

# Re-apply our tmux-resurrect fix before TPM loads it: prefix+U reinstalls the
# stock scripts, which lose a pane's cwd whenever its title is empty.
run-shell '~/.config/tmux/scripts/patch-resurrect-empty-title.sh'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
