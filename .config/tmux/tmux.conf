# ==============================
# TMUX CONFIG — afrijaldz/dotfiles
# ==============================

# Terminal
set -g default-terminal "screen-256color"

# Prefix: Ctrl+A
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Split pane (intuitive)
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Resize pane (repeatable)
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Maximize / zoom pane toggle
bind -r m resize-pane -Z

# Mouse support
set -g mouse on

# Vi-style copy mode
set-window-option -g mode-keys vi

# Copy mode: select & yank
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "~/.local/bin/tmux-yank"

# Paste from Windows clipboard (WSL) — strip trailing newline so it doesn't add an extra enter
bind-key P run "powershell.exe -NoProfile -Command Get-Clipboard | perl -pe 'chomp if eof' | tmux load-buffer -" \; paste-buffer

# Disable mouse drag in copy mode
unbind -T copy-mode-vi MouseDragEnd1Pane

# ==============================
# Pane navigation: Ctrl+hjkl (no prefix!)
# Smart vim-tmux-navigator pattern
# ==============================
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Ctrl+\ to toggle last pane
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\\\\\'  'select-pane -l'"

# ==============================
# TPM — Tmux Plugin Manager
# ==============================
set -g @tpm_plugins ' \
  jimeh/tmux-themepack \
  tmux-plugins/tmux-resurrect \
  tmux-plugins/tmux-continuum \
'

set -g @themepack 'powerline/default/cyan'

# ==============================
# Session persistence
# ==============================
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Continuum's autosave runs off the status bar refresh (`#()` in status-right),
# so it only ticks while a client is attached. Shorter interval = smaller window
# of loss if the machine dies suddenly.
set -g @continuum-save-interval '5'

# Start the tmux server automatically at login (creates + enables ~/.config/systemd/user/tmux.service).
# Without this, after a reboot there's no server at all until we type `tmux`.
# Bonus: the unit's ExecStop saves first before killing, so shutdown doesn't eat state.
set -g @continuum-boot 'on'
# `start-server` (not `new-session -d`) — just spin up the server so continuum
# restore can run, without adding an empty session next to the restored one.
set -g @continuum-systemd-start-cmd 'start-server'

# Must be paired with `start-server` above: the default `exit-empty on` makes
# the server die immediately after it's born because it has no session yet, so
# restore (which waits 1 second) never gets a chance to run.
set -g exit-empty off

# Save on every detach too — once detached, autosave stops ticking until you
# attach again, so without this hook the last state can go stale for hours.
set-hook -g client-detached 'run-shell "~/.config/tmux/scripts/resurrect-save-guard.sh"'

# By default resurrect only restores layout + cwd; running programs are lost.
# `~` = restore the process along with its arguments.
set -g @resurrect-processes '"~claude" "~ssh" "~nvim" "~lazygit" "~btop" "~htop"'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
