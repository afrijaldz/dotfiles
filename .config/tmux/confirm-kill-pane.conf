# Centered yes/no dialog for killing the current pane. Replaces confirm-before,
# whose prompt sits on the status line and is easy to miss. `y` kills, `n`,
# Escape or any other key just closes the menu.
display-menu -T ' Kill pane #P? ' -x C -y C \
    'Yes, kill it'  'y'  'kill-pane' \
    'No'            'n'  ''
