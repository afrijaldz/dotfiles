# The menu that opens on Ctrl+A. Each row is `name  key  command`; pressing the
# key runs the command and closes the menu, so the keys are the same as the
# plain prefix bindings and muscle memory keeps working. It is also clickable.
#
# The menu is a pane-sized overlay, so keep it short enough for a laptop
# terminal. tmux.conf checks the terminal height before opening it and falls
# back to the bare prefix table when the menu would not fit — if you add rows
# here, raise that threshold to match.
#
# Keys that aren't listed do nothing (the menu just closes). Space opens a
# second page (prefix-menu-more.conf) with the stock bindings worth a hint.
#
# Nothing here uses the status-line prompt (confirm-before, command-prompt,
# display-message): it sits bottom-left and is easy to miss. Confirmations
# are centered menus (confirm-kill-*.conf), text input is a popup running
# scripts/prompt-popup.sh, and notices are a one-line menu that any key closes.
display-menu -T ' Ctrl+A ' -x C -y C \
    'Split right'            '|'   'split-window -h' \
    'Split below'            '-'   'split-window -v' \
    'Zoom pane'              'm'   'resize-pane -Z' \
    'Kill pane'              'x'   'source-file ~/.config/tmux/confirm-kill-pane.conf' \
    'Resize left  (repeat)'  'h'   'resize-pane -L 5 ; switch-client -T prefix' \
    'Resize down  (repeat)'  'j'   'resize-pane -D 5 ; switch-client -T prefix' \
    'Resize up    (repeat)'  'k'   'resize-pane -U 5 ; switch-client -T prefix' \
    'Resize right (repeat)'  'l'   'resize-pane -R 5 ; switch-client -T prefix' \
    '' \
    'New window'             'c'   'new-window' \
    'Rename window'          ','   'display-popup -E -T " Rename window " -w 60 -h 3 "~/.config/tmux/scripts/prompt-popup.sh window"' \
    'Next window'            'n'   'next-window' \
    'Previous window'        'p'   'previous-window' \
    'Choose window'          'w'   'choose-tree -Zw' \
    '' \
    'Choose session'         's'   'choose-tree -Zs' \
    'Detach'                 'd'   'detach-client' \
    '' \
    'Copy mode'              '['   'copy-mode' \
    'Paste clipboard'        'P'   'run "~/.local/bin/tmux-paste | tmux load-buffer -" ; paste-buffer' \
    'Toggle dark/light'      'T'   'run-shell "~/.config/tmux/scripts/theme-toggle.sh"' \
    'Reload config'          'r'   'source-file ~/.config/tmux/tmux.conf ; display-menu -T " tmux " -x C -y C "Config reloaded" "" ""' \
    'Send Ctrl+A to the app' 'C-a' 'send-keys C-a' \
    'More keys…'             'Space' 'source-file ~/.config/tmux/prefix-menu-more.conf'
