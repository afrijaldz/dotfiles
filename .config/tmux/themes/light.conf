# Light palette for tmux-themepack.
#
# Themepack ships no light theme — every one of its themes paints the status bar
# on a near-black background (grey-1 is colour233), which clashes with a light
# terminal. It does declare all of its colors with `set -goq`, though, and `-o`
# means "don't overwrite an option that is already set". So pre-setting the
# palette here, before the theme itself is sourced, wins: every @theme-* option
# then derives from these values instead. No fork of the theme needed.
#
# Sourced from two places, and the order matters in both:
#   - tmux.conf, above the `run '~/.tmux/plugins/tpm/tpm'` line that loads the
#     theme at startup.
#   - scripts/theme-toggle.sh, after it clears the previously set options.
#
# Dark mode is simply this file NOT being sourced — the theme's own defaults.

set -g @powerline-color-main-1 colour31    # accent: session name, active pane border, messages
set -g @powerline-color-main-2 colour30    # active window text
set -g @powerline-color-main-3 colour37
set -g @powerline-color-black-1 colour255  # inverse of the bar: active window bg, message text
set -g @powerline-color-grey-1 colour253   # status bar background
set -g @powerline-color-grey-2 colour251   # outer segment background
set -g @powerline-color-grey-3 colour245   # inactive pane border
set -g @powerline-color-grey-4 colour240   # status bar text, middle segment background
set -g @powerline-color-grey-5 colour242
set -g @powerline-color-grey-6 colour238   # hostname segment background, activity flag

# Pane numbers (prefix + q) are not derived from the palette above, and the
# theme's default here resolves to the old dark grey-1 — invisible on a light
# terminal. Set it directly.
set -g @theme-display-panes-colour colour245
