# Second page of the Ctrl+A menu, opened with Space from the first one. These
# are stock tmux bindings, listed here so they get a hint like everything else.
# Same size rule as prefix-menu.conf: tmux.conf's height check must cover the
# taller of the two menus.
#
# Anything not on either page is still one keystroke away: Space again drops
# into the bare prefix table with every default binding.
display-menu -T ' Ctrl+A Space ' -x C -y C \
    'Window 1'               '1'   'select-window -t :1' \
    'Window 2'               '2'   'select-window -t :2' \
    'Window 3'               '3'   'select-window -t :3' \
    'Window 4'               '4'   'select-window -t :4' \
    'Window 5'               '5'   'select-window -t :5' \
    'Last window'            'l'   'last-window' \
    'Kill window'            '&'   'source-file ~/.config/tmux/confirm-kill-window.conf' \
    '' \
    'Rename session'         '$'   'display-popup -E -T " Rename session " -w 60 -h 3 "~/.config/tmux/scripts/prompt-popup.sh session"' \
    'Show pane numbers'      'q'   'display-panes' \
    'Clock'                  't'   'clock-mode' \
    '' \
    'Install TPM plugins'    'I'   'run-shell ~/.tmux/plugins/tpm/bindings/install_plugins' \
    'Update TPM plugins'     'U'   'run-shell ~/.tmux/plugins/tpm/bindings/update_plugins' \
    '' \
    'Command prompt'         ':'   'display-popup -E -T " tmux command " -w 80 -h 3 "~/.config/tmux/scripts/prompt-popup.sh command"' \
    'List every binding'     '?'   'list-keys -N' \
    'Bare prefix (any key)'  'Space' 'switch-client -T prefix'
